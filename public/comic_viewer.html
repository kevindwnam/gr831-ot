<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GR831 오티 만화</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 0;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .page-indicator {
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
        }

        .comic-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .comic-container img {
            width: 100%;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        .top-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(40, 40, 40, 0.9);
            backdrop-filter: blur(10px);
            color: #fff;
            border: 1px solid #444;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 1rem;
            cursor: pointer;
            z-index: 100;
            transition: opacity 0.3s;
            opacity: 0;
        }

        .top-btn.visible {
            opacity: 1;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #555;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.1rem; }
            .comic-container { padding: 10px 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1>GR831 오티 만화</h1>
        <div class="page-indicator" id="pageIndicator">1 / 11</div>
    </header>

    <div class="comic-container" id="comicContainer"></div>

    <button class="top-btn" id="topBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">&#9650;</button>

    <footer>GR831 OT Comic Viewer</footer>

    <script>
        const totalPages = 11;
        const container = document.getElementById('comicContainer');
        const pageIndicator = document.getElementById('pageIndicator');
        const topBtn = document.getElementById('topBtn');

        for (let i = 1; i <= totalPages; i++) {
            const img = document.createElement('img');
            img.src = `images/page_${i}.jpg`;
            img.alt = `Page ${i}`;
            img.loading = i <= 3 ? 'eager' : 'lazy';
            img.dataset.page = i;
            container.appendChild(img);
        }

        const images = container.querySelectorAll('img');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    pageIndicator.textContent = `${entry.target.dataset.page} / ${totalPages}`;
                }
            });
        }, { threshold: 0.5 });

        images.forEach(img => observer.observe(img));

        window.addEventListener('scroll', () => {
            topBtn.classList.toggle('visible', window.scrollY > 400);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Home') window.scrollTo({ top: 0, behavior: 'smooth' });
            if (e.key === 'End') window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        });
    </script>
</body>
</html>
