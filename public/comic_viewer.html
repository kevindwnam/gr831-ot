<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GR831 약술형논술연구소</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: #ffffff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            -webkit-overflow-scrolling: touch;
        }

        .slider {
            display: flex;
            height: 100%;
            will-change: transform;
            transform: translate3d(0, 0, 0);
        }

        .slider.animating {
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .slide {
            flex: 0 0 100vw;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        .slider {
            cursor: pointer;
        }

        .viewer-title {
            font-size: 18px;
            font-weight: 600;
            color: #111;
            padding: 14px 0 10px;
            text-align: center;
        }

        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 20;
        }

        .dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
            transition: background 0.25s, transform 0.25s;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        .dot.active {
            background: #000;
            transform: scale(1.3);
        }

        .page-num {
            font-size: 0.6rem;
            color: rgba(0, 0, 0, 0.35);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="viewer-title">GR831 학습 O.T</div>
    <div class="slider" id="slider"></div>
    <div class="bottom-nav">
        <div class="dots" id="dots"></div>
        <div class="page-num" id="pageNum">1 / 11</div>
    </div>

    <script>
        const total = 11;
        let current = 0;
        const slider = document.getElementById('slider');
        const dotsContainer = document.getElementById('dots');
        const pageNum = document.getElementById('pageNum');
        const vw = () => window.innerWidth;

        for (let i = 1; i <= total; i++) {
            const slide = document.createElement('div');
            slide.className = 'slide';
            const img = document.createElement('img');
            img.src = `images/page_${i}.jpg`;
            img.alt = `Page ${i}`;
            slide.appendChild(img);
            slider.appendChild(slide);

            const dot = document.createElement('button');
            dot.className = 'dot' + (i === 1 ? ' active' : '');
            dot.addEventListener('click', () => slideTo(i - 1));
            dotsContainer.appendChild(dot);
        }

        const dots = dotsContainer.querySelectorAll('.dot');

        function setPosition(px) {
            slider.style.transform = `translate3d(${px}px, 0, 0)`;
        }

        function slideTo(idx) {
            current = Math.max(0, Math.min(total - 1, idx));
            slider.classList.add('animating');
            setPosition(-current * vw());
            dots.forEach((d, i) => d.classList.toggle('active', i === current));
            pageNum.textContent = `${current + 1} / ${total}`;
        }

        slider.addEventListener('transitionend', () => {
            slider.classList.remove('animating');
        });

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') slideTo(current - 1);
            if (e.key === 'ArrowRight') slideTo(current + 1);
        });

        // Unified touch + click on body
        let startX = 0, startY = 0, dx = 0, tracking = false, dirLocked = false, isHorizontal = false;
        let startTime = 0;

        document.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            dx = 0;
            tracking = true;
            dirLocked = false;
            isHorizontal = false;
            startTime = Date.now();
            slider.classList.remove('animating');
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!tracking) return;
            dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;

            if (!dirLocked && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
                dirLocked = true;
                isHorizontal = Math.abs(dx) >= Math.abs(dy);
            }

            if (!dirLocked || !isHorizontal) return;
            e.preventDefault();

            let offset = -current * vw() + dx;
            if (current === 0 && dx > 0) offset = -current * vw() + dx * 0.3;
            if (current === total - 1 && dx < 0) offset = -current * vw() + dx * 0.3;

            setPosition(offset);
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (!tracking) return;
            tracking = false;

            // Tap detection: short duration and minimal movement → treat as click
            const elapsed = Date.now() - startTime;
            if (elapsed < 250 && Math.abs(dx) < 10) {
                const tapX = e.changedTouches[0].clientX;
                if (tapX < vw() * 0.3) slideTo(current - 1);
                else if (tapX > vw() * 0.7) slideTo(current + 1);
                return;
            }

            if (!isHorizontal) { slideTo(current); return; }

            const threshold = vw() * 0.12;
            if (dx < -threshold) slideTo(current + 1);
            else if (dx > threshold) slideTo(current - 1);
            else slideTo(current);
        }, { passive: true });

        // Recalculate on resize
        window.addEventListener('resize', () => {
            slider.classList.remove('animating');
            setPosition(-current * vw());
        });
    </script>
</body>
</html>
