<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GR831 오티 만화</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
            touch-action: pan-y;
        }

        .slider {
            display: flex;
            height: 100vh;
            transition: transform 0.35s ease;
        }

        .slide {
            min-width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        .nav-area {
            position: fixed;
            top: 0;
            width: 30%;
            height: 100%;
            z-index: 10;
            cursor: pointer;
        }

        .nav-area.left { left: 0; }
        .nav-area.right { right: 0; }

        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 20;
        }

        .dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transition: background 0.25s, transform 0.25s;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        .dot.active {
            background: #fff;
            transform: scale(1.3);
        }

        .page-num {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="slider" id="slider"></div>
    <div class="nav-area left" id="navLeft"></div>
    <div class="nav-area right" id="navRight"></div>
    <div class="bottom-nav">
        <div class="dots" id="dots"></div>
        <div class="page-num" id="pageNum">1 / 11</div>
    </div>

    <script>
        const total = 11;
        let current = 0;
        const slider = document.getElementById('slider');
        const dotsContainer = document.getElementById('dots');
        const pageNum = document.getElementById('pageNum');

        // Build slides and dots
        for (let i = 1; i <= total; i++) {
            const slide = document.createElement('div');
            slide.className = 'slide';
            const img = document.createElement('img');
            img.src = `images/page_${i}.jpg`;
            img.alt = `Page ${i}`;
            slide.appendChild(img);
            slider.appendChild(slide);

            const dot = document.createElement('button');
            dot.className = 'dot' + (i === 1 ? ' active' : '');
            dot.addEventListener('click', () => goTo(i - 1));
            dotsContainer.appendChild(dot);
        }

        const dots = dotsContainer.querySelectorAll('.dot');

        function goTo(idx) {
            current = Math.max(0, Math.min(total - 1, idx));
            slider.style.transform = `translateX(-${current * 100}vw)`;
            dots.forEach((d, i) => d.classList.toggle('active', i === current));
            pageNum.textContent = `${current + 1} / ${total}`;
        }

        // Click navigation
        document.getElementById('navLeft').addEventListener('click', () => goTo(current - 1));
        document.getElementById('navRight').addEventListener('click', () => goTo(current + 1));

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') goTo(current - 1);
            if (e.key === 'ArrowRight') goTo(current + 1);
        });

        // Touch swipe
        let startX = 0;
        let dragging = false;

        slider.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            dragging = true;
            slider.style.transition = 'none';
        });

        slider.addEventListener('touchmove', (e) => {
            if (!dragging) return;
            const dx = e.touches[0].clientX - startX;
            slider.style.transform = `translateX(calc(-${current * 100}vw + ${dx}px))`;
        });

        slider.addEventListener('touchend', (e) => {
            if (!dragging) return;
            dragging = false;
            slider.style.transition = 'transform 0.35s ease';
            const dx = e.changedTouches[0].clientX - startX;
            if (dx < -50) goTo(current + 1);
            else if (dx > 50) goTo(current - 1);
            else goTo(current);
        });
    </script>
</body>
</html>
